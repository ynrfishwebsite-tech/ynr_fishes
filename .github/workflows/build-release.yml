name: Build and Release Auto-Updater

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (.EXE and .APK)
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏷️ Get App Version
        id: get_version
        shell: pwsh
        run: |
          $ver = (Get-Content ./Desktop/package.json | ConvertFrom-Json).version
          echo "version=v$ver" >> $env:GITHUB_OUTPUT

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📝 Inject Backend .env File
        working-directory: ./backend
        shell: pwsh
        run: |
          Set-Content -Path .env -Value $env:BACKEND_ENV_SECRET
        env:
          BACKEND_ENV_SECRET: ${{ secrets.BACKEND_ENV }}

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm install --omit=dev

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 📦 Install Desktop Dependencies
        working-directory: ./Desktop
        run: npm install

      - name: 🏗️ Build Frontend Web Assets
        working-directory: ./frontend
        run: npm run build

      - name: 📱 Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: 🔑 Ensure Release Keystore
        working-directory: ./frontend/android
        shell: pwsh
        run: |
          if (-not (Test-Path keystore.jks)) {
            Write-Host "Generating fresh keystore.jks..."
            & "$env:JAVA_HOME\bin\keytool" -genkeypair -v -keystore keystore.jks -alias msbilling -keyalg RSA -keysize 2048 -validity 10000 -storepass "msbilling2026" -keypass "msbilling2026" -dname "CN=YNR Fishes, OU=POS, O=YNR Fishes, L=City, ST=State, C=IN"
          } else {
            Write-Host "Using existing repository keystore.jks."
          }

      - name: 🔨 Build Android APK (.apk)
        working-directory: ./frontend/android
        env:
          KEYSTORE_PASSWORD: "msbilling2026"
          KEY_ALIAS: "msbilling"
          KEY_PASSWORD: "msbilling2026"
        run: .\gradlew.bat assembleRelease assembleDebug

      - name: 🚀 Build and Publish Desktop App (.exe)
        working-directory: ./Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run prebuild && npx electron-builder --win -p always

      - name: 📱 Upload APK Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

